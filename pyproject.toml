[project]
name = "etl-vps"
version = "0.1.0"
description = "ETL SAP → MySQL"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pandas",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "mysql-connector-python",
    "openpyxl",
    "pyarrow",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etl_vps"]
